services:
  # Backend de Proyecto Bowl (Node). Mismo patrón que Trento: frontend en GitHub Pages,
  # API en Render, datos en el MISMO cluster Mongo de Sushi, aislado por colecciones
  # bowl_data y bowl_history. Las entradas con sync:false se pegan a mano en Render.
  - type: web
    name: proyectobowl-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: MONGO_URI
        sync: false            # MISMO valor que sushi-queen-backend
      - key: MONGO_DATABASE
        value: sushi_queen     # misma base; colecciones bowl_* propias
      - key: BOWL_PIN
        sync: false            # PIN para guardar desde la calculadora
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hackerjj.github.io,http://localhost:8080"
      - key: NODE_VERSION
        value: "20"
